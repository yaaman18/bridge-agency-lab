<title>記憶する回路</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@500;700&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a living specimen under glass. Vital line on top, world and memory side by side, the long record below. */
:root {
  --paper: #edf0f2; --panel: #f9fafb; --ink: #1b2430; --muted: #5b6878; --line: #c9d1d9;
  --p1: #2f68b0; --p2: #23845a; --act: #b9790c; --bad: #b8382a; --sed: #7a4fa8;
  --f-display: "Zen Kaku Gothic Antique", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10151b; --panel: #182029; --ink: #e1e7ee; --muted: #93a1b1; --line: #2b3643;
  --p1: #6fa5ea; --p2: #5dc092; --act: #e8b24c; --bad: #ef6e5e; --sed: #b896e6; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #10151b; --panel: #182029; --ink: #e1e7ee; --muted: #93a1b1; --line: #2b3643;
  --p1: #6fa5ea; --p2: #5dc092; --act: #e8b24c; --bad: #ef6e5e; --sed: #b896e6; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1140px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.8rem; margin: 0; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; margin: 0; }
.lede { color: var(--muted); max-width: 74ch; margin: 4px 0 0; }
.vitals { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.vitals b { font-size: 1.35rem; font-weight: 500; }
.vitals span { color: var(--muted); font-size: .8rem; margin-right: 4px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: .86rem; color: var(--muted); }
button { font: inherit; font-size: .86rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 5.5em; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.grid { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); gap: 16px; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; align-content: start; }
svg { display: block; width: 100%; height: auto; }
.chip { font-family: var(--f-mono); font-size: .76rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { color: var(--p2); border-color: var(--p2); } .chip.bad { color: var(--bad); border-color: var(--bad); } .chip.act { color: var(--act); border-color: var(--act); }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
table.mem { border-collapse: separate; border-spacing: 4px; font-family: var(--f-mono); font-size: .8rem; }
table.mem th { color: var(--muted); font-weight: 400; text-align: left; padding-right: 8px; white-space: nowrap; }
table.mem td { width: 64px; height: 30px; border-radius: 5px; border: 1px solid var(--line); position: relative; }
.cellq { position: absolute; inset: 0; border-radius: 4px; background: var(--p1); }
.cells { position: absolute; right: 4px; bottom: 3px; display: flex; gap: 2px; }
.cells i { width: 6px; height: 6px; border-radius: 50%; background: var(--sed); display: block; }
.scroll { overflow-x: auto; }
canvas { width: 100%; height: 150px; display: block; }
canvas#world { height: auto; aspect-ratio: 360 / 230; }
canvas#mem { height: 436px; min-width: 300px; }
[hidden] { display: none !important; }
.cap { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.notes { color: var(--muted); font-size: .88rem; max-width: 78ch; display: grid; gap: 6px; }
.notes b { color: var(--ink); }
.confirm { display: inline-flex; gap: 8px; align-items: center; }
.you { display: grid; gap: 12px; }
.lamp { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.lamp .dot { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); flex: none; transition: background .12s, box-shadow .12s; }
.lamp .dot.on { background: var(--act); border-color: var(--act); box-shadow: 0 0 0 6px color-mix(in srgb, var(--act) 25%, transparent); }
.lamp .dot.ans { background: var(--p2); border-color: var(--p2); }
.lamp .txt { font-size: .9rem; color: var(--muted); }
.lamp .txt b { color: var(--ink); font-family: var(--f-display); font-size: 1.05rem; display: block; }
.pend { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.pend i { display: block; height: 100%; background: var(--act); width: 0; }
.pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pad button { font-size: 1.5rem; line-height: 1; padding: 14px 0; border-radius: 10px; }
.pad button small { display: block; font-size: .7rem; color: var(--muted); margin-top: 4px; font-family: var(--f-mono); }
.pad button.flash { background: var(--p1); color: var(--paper); border-color: var(--p1); }
.instr { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--ink); }
.sess { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.modes { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .86rem; color: var(--muted); }
table.st { border-collapse: collapse; font-family: var(--f-mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
table.st th, table.st td { padding: 3px 10px 3px 0; text-align: right; } table.st th:first-child, table.st td:first-child { text-align: left; }
table.st th { color: var(--muted); font-weight: 400; }
input[type=range] { width: 120px; accent-color: var(--act); }
</style>
