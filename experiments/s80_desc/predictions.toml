# S80 記述の確かめ（仕様 §10.5、codex 11:56Z P2〜P4、設計は codex S-R 11:59Z P1〜P8 取り込み）。2026-11-25 ユーザー「codex の案で進めて」。
# 既見の 8 生だけ、新しい種子なし。L = 1,000。C4: c_t = ℓ_t − μ_t − 0.01（μ_t は ℓ_t の前の EMA）、m += c_t、M = min(M, m)、
# 判定点 t % 50 == 0 で m − M > h なら警報、m = M = 0。c_t は h に依らない。h* = 7.5（s80_diag）、記述として h = 19 も。
# 区間: 通常 120（routinewins）、形成 30（選んだ切替の [T+1, T+1000]、selset ε = 0.0025・w0 で事前に決まる。取り逃がし 3 本を含み、警報の有無で採否を決めない）。
# A: n0（区間の Y = 0 の数）の幅 3 の層ごと、各 h で、全区間数・1 回以上警報した区間数・警報総数を通常/形成で（表示のみ）。
# B: 区間ごとに a = Y = 0 の例の c の平均、b = Y = 0 の例の ℓ の平均（n0 > 0 のときだけ定義）。形成区間ごとに、同じ生で |n0_r − n0_f| ≤ 1 かつ n0 > 0 の通常区間を候補とし、
#    D = a_f − median(候補の a_r)。候補がなければ保留。生をまたいで補わない。生ごとの D の中央値。主判定は a、b は説明用。n0 の完全一致での生ごとの D の符号も併記。
#    生ごとの有効な形成区間数と、使った通常区間の実数（重複を除く）を出す。
# C: 警報の出た通常区間と、検出した形成区間で、区間の中の最初の警報について: S0（区間の始めの m − M）、Σc（Y = 0）、Σc（Y ≠ 0）、M の低下量、最大の単発 c、警報時の m − M。
#    恒等式 警報時の m − M = S0 + Σc(Y=0) + Σc(Y≠0) + (始めの M − 警報時の M) を関門にする。
#    持越しの反例: 同じ c 列・判定点で S0 = 0（m = M = 0）から再計算し、元の警報時刻までに m − M > h になる区間。
#    単発依存の反例: 正の c を 1 個ずつ 0 にした再計算（始めの m・M は元のまま、μ は固定）のすべてで、元の時刻までに警報する区間。
# 判定の規則: 先に R2 を当てる。R2 = 有効な形成区間が 15 未満、または有効な形成区間のある生が 5 未満 → 保留（比べられる区間が足りない）。
#    R2 でなければ R1 = 生ごとの D の中央値の符号検定（零は除く）が片側 p ≤ 0.05、かつ全形成区間の D の中央値 > 0。
#    R1 なら次に予測を一つ凍結して未見の生で確かめる。R1 でも R2 でもなければ、時計探しを保留して S80 本走りへ戻る（§10.5 P6）。
[E1]
label = "R2 に当たらない（有効な形成区間 15 以上、生 5 以上）"
[E2]
label = "R1 が成立する（形成区間の a は、Y = 0 の数をそろえた同じ生の通常区間より大きい）"
[E3]
label = "h* で警報の出た通常区間の過半数で、S0 = 0 から再計算しても元の時刻までに警報する（持越しは必須でない）"
[E4]
label = "h* で警報の出た通常区間の過半数で、単発依存の反例になる（どの 1 例を除いても警報する）"
