# S81 記述: C4 と O-win を切替ごとに対にする（仕様 discussion/specs/S81-draft-pair-c4-owin.md、codex S-R 12:34Z P1〜P5 取り込み）。2026-11-25 ユーザー「じゃあ進めて」。
# 既見 48 生だけ（S72 r4 の 8 生 + S80 改訂 1 の 40 生）、新しい種子なし。閾値は S80 の凍結値（C4 δ=0.01 h=13.75、O-win 窓 500 θ=0.0075）、L = 1,000。
# 組: 選んだ切替（183）ごとに C4・O-win の検出（[T+1, T+1000] に警報）で 両方 / O だけ / C4 だけ / どちらも。n0 = 形成区間の Y=0 の数。
# F1: 切替を各 1 票、48 生を併合。median(n0 | O だけ) < median(n0 | 両方) のときだけ的中（偶数件は中央 2 値の平均、同値は外れ、空の群は判定不能）。8 生と 40 生の群別件数・中央値を併記。
# F2: 生ごとの基準 = 同じ生の n0 > 0 の各通常区間の a = Σc(Y=0)/n0 の中央値（区間を各 1 票、n0 = 0 は欠測）。
#     分母 D = O だけかつ n0 > 0 の切替の数（同値も D に含む）。K = a_f > 基準 の数。2K > D で的中、D = 0 または基準が未定義の生があれば判定不能（件数を出す）。
# 読み（codex P5）: 両方的中で言えるのは「O だけの群は両方の群より n0 の中央値が低く、F2 の過半数条件も満たす」まで。時計一般の上限は言わない。
[F1]
label = "O だけが検出した切替の n0 の中央値は、両方が検出した切替の n0 の中央値より小さい"
[F2]
label = "O だけが検出し n0 > 0 の切替の過半数で、a_f が同じ生の通常区間の a の中央値を厳密に上回る"
