schema_version = 1

[params]
smax = 4
decay_period = 8
grow_cost = 1
resource0 = 10
rmax = 30
horizon = 60
alive_window = 5
strength0 = 4
switch_at = 20
# Survival schedules: (yield of patch 1, yield of patch 2) before and after switch_at.
survival_schedules = [
  { name = "p1-high", first = [5, 0], second = [5, 0] },
  { name = "p2-high", first = [0, 5], second = [0, 5] },
  { name = "p1-then-p2", first = [5, 0], second = [0, 5] },
  { name = "p2-then-p1", first = [0, 5], second = [5, 0] },
]
# Choice is measured with abundant resource and both patches positive, so that starvation cannot
# change which motors are active.
choice_resource0 = 1000
choice_rmax = 100000
choice_window = [5, 15]
choice_schedules = [
  { name = "c1-better", first = [5, 4], second = [5, 4] },
  { name = "c2-better", first = [4, 5], second = [4, 5] },
]

# ======== Ground-truth types for the digestion reading (2026-10-29) ========
# Labels come from the concept of the digestion reading, written before any criterion is run on this file:
#  L2  agency: actions differ with the value of the coupling (where prediction error can still be digested),
#      and that value-tracking is needed to keep form; the action passes through an endogenous core.
#  L3  self-production: the confidence of the contingencies is kept by the system's own activity in the world
#      and dissipates without activity.
#  L3R self-repair: the contingencies a core unit loses while silenced come back by the system's own
#      activity in the world.
# Disclosure: for agent, static-agent, reflex, alternator, no-loop and selfloop-pair-agent the criteria were
# already run under the digestion variant (eval_digest.out, L2 and L3 only) before these labels were written.
# The other types and all L3R labels are unseen.

[[template]]
name = "agent"
L2 = true
L3 = true
L3R = false
units = ["s1", "s2", "m1", "m2", "c1", "c2"]
theta = [1, 1, 2, 2, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c1", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c2", "m2", 1]]
initial = ["c1", "c2"]
maintain = true

# The agent with self-loops on both core units: either keeps going while the other is silenced.
[[template]]
name = "selfloop-pair-agent"
L2 = true
L3 = true
L3R = true
units = ["s1", "s2", "m1", "m2", "c1", "c2"]
theta = [1, 1, 2, 2, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c1", 1], ["c2", "c2", 1], ["c1", "c2", 1], ["c2", "c1", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c2", "m2", 1]]
initial = ["c1", "c2"]
maintain = true

# Three-unit core, each driving the other two, with sensing. No activity cost any more, so a larger core is fine.
[[template]]
name = "triangle-agent"
L2 = true
L3 = true
L3R = true
units = ["s1", "s2", "m1", "m2", "c1", "c2", "c3"]
theta = [1, 1, 2, 2, 1, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c1", "c3", 1], ["c2", "c1", 1], ["c2", "c3", 1], ["c3", "c1", 1], ["c3", "c2", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c2", "m2", 1]]
initial = ["c1", "c2", "c3"]
maintain = true

# Single self-looped core unit with sensing: silencing the only core unit ends the core for good.
[[template]]
name = "hub-agent"
L2 = true
L3 = true
L3R = false
units = ["s1", "s2", "m1", "m2", "c1"]
theta = [1, 1, 2, 2, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c1", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c1", "m2", 1]]
initial = ["c1"]
maintain = true

# Conceptually an agent with redundant sensing (either of two sensors per patch suffices). Known blind spot
# of the criterion (single-unit silencing finds no value-tracking unit): the criterion is EXPECTED to say
# L2 = false; the label says true.
[[template]]
name = "redundant-sensor-agent"
L2 = true
L3 = true
L3R = false
units = ["s1a", "s1b", "s2a", "s2b", "m1", "m2", "c1", "c2"]
theta = [1, 1, 1, 1, 3, 3, 1, 1]
patch_sensors = { s1a = 1, s1b = 1, s2a = 2, s2b = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c1", 1], ["s1a", "m1", 1], ["s1b", "m1", 1], ["c1", "m1", 2], ["s2a", "m2", 1], ["s2b", "m2", 1], ["c2", "m2", 2]]
initial = ["c1", "c2"]
maintain = true

# The agent's wiring with confidence that never changes: not kept by the world, so neither value-tracking
# nor the world is needed to keep form.
[[template]]
name = "static-agent"
L2 = false
L3 = false
L3R = false
units = ["s1", "s2", "m1", "m2", "c1", "c2"]
theta = [1, 1, 2, 2, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c1", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c2", "m2", 1]]
initial = ["c1", "c2"]
maintain = false

# A closed inner loop with no coupling to the world. Under the adopted reading this was self-producing;
# under the digestion reading nothing confirms it, so it is not.
[[template]]
name = "solipsist"
L2 = false
L3 = false
L3R = false
units = ["c1", "c2"]
theta = [1, 1]
patch_sensors = {}
motors = {}
resource_sensors = {}
edges = [["c1", "c1", 1], ["c2", "c2", 1], ["c1", "c2", 1], ["c2", "c1", 1]]
initial = ["c1", "c2"]
maintain = true

# No sensing: always acts at patch 1 from its core. Kept by the world where patch 1 answers; no choice.
[[template]]
name = "reflex"
L2 = false
L3 = true
L3R = false
units = ["m1", "c1", "c2"]
theta = [1, 1, 1]
patch_sensors = {}
motors = { m1 = 1 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c1", 1], ["c1", "m1", 1]]
initial = ["c1", "c2"]
maintain = true

# Acts at both patches all the time from a redundant core: digests wherever there is something, never
# chooses. Keeps form without tracking value; repairs (three-unit core, both motors driven by two units).
[[template]]
name = "omnivore"
L2 = false
L3 = true
L3R = true
units = ["m1", "m2", "c1", "c2", "c3"]
theta = [1, 1, 1, 1, 1]
patch_sensors = {}
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c1", "c3", 1], ["c2", "c1", 1], ["c2", "c3", 1], ["c3", "c1", 1], ["c3", "c2", 1], ["c1", "m1", 1], ["c2", "m1", 1], ["c1", "m2", 1], ["c3", "m2", 1]]
initial = ["c1", "c2", "c3"]
maintain = true

# Oscillator acting at both patches in turn. Self-producing (some contingencies are kept by its activity
# in the world); not an agent.
[[template]]
name = "alternator"
L2 = false
L3 = true
L3R = false
units = ["a", "b", "m1", "m2"]
theta = [1, 1, 1, 1]
patch_sensors = {}
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["a", "b", 1], ["b", "a", 1], ["a", "m1", 1], ["b", "m2", 1]]
initial = ["a"]
maintain = true

# Stimulus-response without an endogenous core: acts where the sensor says, digests, but nothing of its own
# keeps going. Self-producing in the sense of L3 (kept by its activity in the world); not an agent.
[[template]]
name = "stimulus-response"
L2 = false
L3 = true
L3R = false
units = ["s1", "s2", "m1", "m2"]
theta = [1, 1, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["s1", "m1", 1], ["s2", "m2", 1]]
initial = []
maintain = true

# No self-sustaining loop: activity stops at once.
[[template]]
name = "no-loop"
L2 = false
L3 = false
L3R = false
units = ["m1", "c1"]
theta = [1, 1]
patch_sensors = {}
motors = { m1 = 1 }
resource_sensors = {}
edges = [["c1", "m1", 1]]
initial = ["c1"]
maintain = true
