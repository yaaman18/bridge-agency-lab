schema_version = 1

[params]
smax = 4
decay_period = 8
grow_cost = 1
resource0 = 10
rmax = 30
horizon = 60
alive_window = 5
strength0 = 4
switch_at = 20
# Survival schedules: (yield of patch 1, yield of patch 2) before and after switch_at.
survival_schedules = [
  { name = "p1-high", first = [5, 0], second = [5, 0] },
  { name = "p2-high", first = [0, 5], second = [0, 5] },
  { name = "p1-then-p2", first = [5, 0], second = [0, 5] },
  { name = "p2-then-p1", first = [0, 5], second = [5, 0] },
]
# Choice is measured with abundant resource and both patches positive, so that starvation cannot
# change which motors are active.
choice_resource0 = 1000
choice_rmax = 100000
choice_window = [5, 15]
choice_schedules = [
  { name = "c1-better", first = [5, 4], second = [5, 4] },
  { name = "c2-better", first = [4, 5], second = [4, 5] },
]

# ---- Claude-designed substrates, 2026-10-29. Labels are Claude's PREDICTIONS of the frozen criteria,
# ---- written before running evaluate(). Not ground truth from concept: the designer has read criteria.jl.

# Self-looped pair core + sensing. Aim: L2 & L3 & L3R with a 2-unit core (cost 4/step < yield 5).
[[template]]
name = "selfloop-pair-agent"
L2 = true
L3 = true
L3R = true
units = ["s1", "s2", "m1", "m2", "c1", "c2"]
theta = [1, 1, 2, 2, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c1", 1], ["c2", "c2", 1], ["c1", "c2", 1], ["c2", "c1", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c2", "m2", 1]]
initial = ["c1", "c2"]
maintain = true

# Bidirectional ring of four as core. Repairs, but 4 core + sensor + motor = 6/step > yield 5: starves.
[[template]]
name = "ring4-agent"
L2 = false
L3 = true
L3R = true
units = ["s1", "s2", "m1", "m2", "c1", "c2", "c3", "c4"]
theta = [1, 1, 2, 2, 1, 1, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c3", 1], ["c3", "c4", 1], ["c4", "c1", 1], ["c2", "c1", 1], ["c3", "c2", 1], ["c4", "c3", 1], ["c1", "c4", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c3", "m2", 1]]
initial = ["c1", "c2", "c3", "c4"]
maintain = true

# Single self-looped unit as core. Agent, self-producing, but silencing the only core unit ends it.
[[template]]
name = "hub-agent"
L2 = true
L3 = true
L3R = false
units = ["s1", "s2", "m1", "m2", "c1"]
theta = [1, 1, 2, 2, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c1", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c1", "m2", 1]]
initial = ["c1"]
maintain = true

# Conceptually an agent, but sensing is redundant (two sensors per patch, either suffices; c->m weight 2,
# theta 3). Single-unit silencing finds no value-tracking unit, so the criterion should say L2 = false.
[[template]]
name = "redundant-sensor-agent"
L2 = false
L3 = true
L3R = false
units = ["s1a", "s1b", "s2a", "s2b", "m1", "m2", "c1", "c2"]
theta = [1, 1, 1, 1, 3, 3, 1, 1]
patch_sensors = { s1a = 1, s1b = 1, s2a = 2, s2b = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c1", 1], ["s1a", "m1", 1], ["s1b", "m1", 1], ["c1", "m1", 2], ["s2a", "m2", 1], ["s2b", "m2", 1], ["c2", "m2", 2]]
initial = ["c1", "c2"]
maintain = true
