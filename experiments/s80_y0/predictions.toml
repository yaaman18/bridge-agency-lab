# S80 Y=0 時計の比べ（既見の 8 生だけ。新しい種子は開けない）。2026-11-25 ユーザー「Y = 0 の数だけの時計と比べるをやって」。
# 問い: 学習器を使わず「直前 w 例の Y = 0 の数」だけで判定する時計 Y0c は、C4（δ = 0.01）と同じ検出・誤作動の曲線を描くか。
