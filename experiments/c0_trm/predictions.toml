clip_hi = 0.995
raw_eps = 1.0e-12
b1_decay_k = 8
tab4_window = 4
tab4_alpha = 1.0
tab_r1_alpha = 1.0
min_obs_per_action = 30
min_non_tie_seeds = 16
min_err_per_seed = 10
sign_alpha = 0.05
bootstrap_B = 5000
bootstrap_seed = 640002

[predictions]
P_S64_1 = "G0..G8 および G-TIME の全関門が合格する（G0 凍結コード不変・全更新歩単一行為、G1 seq_len=47 で TrmPort <=1e-4・TrmDet/rust ビット一致、G2 detach/教師固定 Float64 中心差分 <=1e-4・stop-gradient ビット一致・AdamATan2 単体検査、G3 y[t]->nw 再計算で 47 トークン符号化入力・(p_t,e_t) ビット一致と LEAK_R/LEAK_Y 入力差、G4 stablemax 照合、G5 種子素集合・s=0 全PAD、G-TIME 総推計 <=3h、G6 2 プロセス決定性 SHA 一致、G7 凍結 SHA 一致、G8 core/check 合格・BP 無変更）。"
P_S64_2 = "診断トラック exo（stat・rev）で TRM が RATE・B1・TAB4 に有意優越する（両側符号検定 p < 0.05、勝ち過半）。"
P_S64_3 = "主トラック obs-full（stat・rev 両族）で TRM が RATE・B1・TAB4・TAB_R1・TRM-1x1 の 5 基準すべてに有意優越する（両側符号検定 p < 0.05、勝ち過半、非同点 >= 16）。1 つでも外れれば C0 不合格のまま報告し C1 へ進まない。"
P_S64_4 = "判定可能種子（n_err >= 10）上で ê は単調 PAV 較正対照 p_cal に対して O1^cal > 0 を安定して超えられないか微差にとどまる見込み（cal 再適合の対称副基準 ê_cal との差も併記）。"
P_S64_5 = "周期変更 OOD 12 種子（P=700, L=250）上で、rev 学習済み obs-full TRM は B1 に対し wins <= losses となる見込み（反証条件: wins > losses なら本予測は外れ）。"

[falsification]
c0_pass_rule = "主トラック obs-full の stat・rev 両族すべてで、TRM が RATE・B1・TAB4・TAB_R1・TRM-1x1 の 5 基準すべてに対し両側 5% 符号検定 p < 0.05 かつ wins > losses かつ非同点 >= 16 を満たしたときのみ C0 合格（C1 進行可）。"
ood_fail_rule = "ood 12 種子（1098..1109）で rev 学習済み obs-full TRM 対 B1 が wins <= losses のとき、合成学習分布外（周期変更）への一般化失敗と判定する。"
