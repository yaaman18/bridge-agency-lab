# S64 C0 予測器（seq_len = 47 TRM 開ループ検証）事前予測・凍結定数（2026-11-23）
# 仕様: discussion/specs/S64-c0-trm-openloop.md (r3, 3 系統 APPROVE)
# 凍結ファイル: experiments/freeze-c0-trm.txt
# 結果を見た後にこのファイルを書き換えてはならない。外れた予測は外れたまま報告する。

[meta]
