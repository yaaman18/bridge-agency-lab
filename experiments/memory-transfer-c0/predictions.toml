# memory-transfer-c0 — 局所積の記憶候補を AUE の合成世界で読むだけ（C0 相当）の独立予備実験
# 予測・反証・対象・採点（生成と評価の前に凍結、2026-11-18、claude-lab）
# 凍結: shasum -a 256 を experiments/freeze-memory-transfer-c0.txt に記録。結果を見たあとでこのファイルを書き換えない。
# 根拠: discussion/notes/D-PRED.md 第二部 §2（C0 の関門・B1・漏れの関門・時刻）、§1.6（空の合格）、
#       experiments/memory-transfer-pilot/（先の局所積 LP の予備実験、項の作りと移植の手順）。
# 位置づけ: 系統の側の独立予備実験。正式な C0（D-PRED §5 の S 仕様、TRM）ではない。TRM は使わない。
#   既存の C0 の計画・個体・アプリの db・凍結・既定・~/bridge-protocol は変えない。閉ループなし（行為は UNI が引く）。
#   主張に使う種子の列（次は 886）を使わない。結果は主張の根拠に数えない（予備実験の記録だけ）。

[world]
# 既存の S57 の構成をそのまま読み込んで使う（experiments/draw_conf_grid.jl を書き換えず、ソースを読んで
# 最後の実行部 "if MODE in (" より前だけを別のモジュールで評価する）。合成世界は experiments/synth_world.jl。
law = "L2"                      # S57 の BASE（U 0.02, MCOST 0.004, KC 0.002, RAISE body, CONTRAST bin3, IDLE, GATE, FEED）
arm = "UNI"                     # 引く確率は候補の中で均等（候補二つの歩は 1/2）。乱数のビットは S55 の規則 gen_bits(u)、メモリの上だけ（ファイルに書かない）
steps = 10000
T0 = 800                        # 窓の始まり（飼育の後）。痕跡はここで初期化する
family_in = { P = 1000, sigma = 1, L = 300, M = 2.5 }    # S57 の世界の族（訓練と族の中の評価）
family_ood = { P = 600, sigma = 1, L = 300, M = 2.5 }    # 学習に使わない世界の条件（周期だけ変える）。副の評価

[seeds]
# 独立予備実験の種子の区画（主の列 1〜885・669 と重ならない。README・freeze・STATE に種子として現れない番号）。
train = "52001:52012"           # 訓練の世界 12
eval = "52101:52124"            # 未見の評価の世界 24（族の中）
ood = "52201:52212"             # 未見の評価の世界 12（族の外、P = 600）
gate_reproduce = 686            # 関門 G1 だけ: S57 の下調べの種子（既存の記録 draw-conf-out/pilot/L2_UNI_u686.json と照合）

[examples]
# 例 = 窓の中（t >= T0）の引いた歩（候補が二つ以上、S57 の drawn_ts と同じ）。a = 選ばれた区画、Y = 応え（S57 の ans: y[a] > 0）。
# 評価はすべて同じ例（選ばれた行為の例）の上で行う。選ばなかった行為には正解を置かない。
# 痕跡の更新: 窓の中の毎歩、その歩に行為した各区画 p について Y_p = (y[p] > 0) で更新（ON_STEP の読むだけの観察から）。
# 時刻: 歩 u の予測は歩 u−1 までの更新だけを読む。順は 予測 → （行為・応え）→ 痕跡の更新。歩 u の y は読まない。

[predictors]
clip = "[1/200, 199/200]"       # すべての予測器の確率に同じ切り詰め
RATE = "行為ごとの応えの割合。訓練の例から (応えの数 + 1) / (例の数 + 2)。数として移す"
B1 = "痕跡一つ: 行為ごとの漏れのある平均 m_a ← m_a + (Y − m_a)/8（8 = core/circuit.jl の P_DECAY）、初期 1/2、学習なし。p = m_a"
LP = """局所積の記憶候補。痕跡 m_1, m_2 は B1 と同じ規則で個体が持つ（学習しない、移さない）。
文脈の符号 c = (1, 2m_1 − 1, 2m_2 − 1)、行為の符号 f(1) = (1, +1)、f(2) = (1, −1)。
共有の 6 チャネルの局所積 h = f(a) ⊗ c（h_(i,j) = f_i(a)·c_j）、s = w·h、p = σ(s)。
結合 w（6 個）だけを訓練で学ぶ: 初期 0、訓練の全例（種子の昇順・歩の昇順）の平均の対数損失の勾配で一括の勾配降下、歩幅 1、4000 回、Float64。
移植: 訓練の後、w だけを新しい個体へ写す。痕跡・勾配・回数・訓練の最後の世界の痕跡は移さず、評価の各世界の T0 で痕跡を 1/2 に初期化。"""
LP0 = "対照: LP と同じ学習で、文脈を c = (1, 0, 0) に固定（痕跡を読まない。行為ごとの割合を学んだのと同じ形）"
INIT = "対照: w = 0 の LP（p = 1/2）"
# 特徴・ハイパーパラメータ（clip、8、1/2、符号、歩幅、回数、Laplace）は事前に固定。評価の世界を見て変えない。検証の分割は置かない（選ぶものがない）。

[scoring]
# 種子ごと・行為ごとに、その行為が選ばれた例の平均の対数損失 L_{s,a}（自然対数）。種子の点 = (L_{s,1} + L_{s,2})/2。
# 除外: どちらかの行為の例が 30 未満の種子を外す（除外の集合は全部の比較で共通、評価の集合ごと）。
# 比較: 種子ごとに点の小さい方が勝ち、完全に等しい点は同点。同点でない種子で両側の正確な符号検定、p < 0.05 かつ勝ちが多いとき優越。
# 族の中の評価で同点でない種子が 16 未満なら「検出不能」。族の外は副（16 の下限は置かず、記述）。
# 併記: 点の差の中央値と範囲、種子ごとの行為ごとの例の数、応えのない例の数。
primary = ["B1 vs RATE", "LP vs RATE", "LP vs B1"]
secondary = ["LP vs LP0（痕跡の寄与）", "INIT vs RATE（健全性）", "族の外での同じ三つ"]

[prediction]
# 確かさの言葉は事前の見込み。S57 で応えの割合は約 0.99（README 項番168、既知の事実）なので応えのない例は少ない。
V1 = "訓練の例の応えの割合は 0.95 以上。族の中の評価で応えのない例は合計 200 以上（下回れば土台が薄く、空の合格の恐れとして扱う）"
P1 = "B1 は RATE に優越（族の中）。見込みは低め: 応えのない歩が時間に固まっていれば B1 が勝ち、ばらばらなら負ける"
P2 = "LP は RATE に優越（族の中）"
P3 = "LP は B1 に優越（族の中）"
P4 = "LP は LP0 に優越（族の中、副。痕跡を読む結合が損失を下げる）"
P5 = "INIT は除外されない全種子で RATE に負ける（副、健全性）"
P6 = "族の外（P = 600）でも LP は RATE と B1 に過半の種子で勝つ（副、記述）"
P7 = "関門 G0〜G7 はすべて合格し、別プロセスの再実行で結果のハッシュが一致する"

[gates]
G0 = "使う既存のコード（draw_conf_grid.jl, check_draw_conf.jl, check_draw.jl, synth_world.jl, core/circuit.jl, core/body_org.jl）の SHA-256 が freeze-draw-conf-code.txt と一致"
G1 = "種子 686 の L2 UNI を走らせ、引いた歩の t・選択・応え・y が既存の記録 draw-conf-out/pilot/L2_UNI_u686.json と一致。負の対照: 687 の記録とは一致しない"
G2 = "引いた歩ごとに ON_STEP の行為 = [a]、応え = (y[a] > 0)。負の対照: 一歩ずらすと不一致が出る"
G3 = "漏れ: 例 u の Y を反転しても RATE・B1・LP・LP0 の p_u はビット一致、B1 のその行為の次の例の p は変わる。負の対照: Y_u を読む予測器 LEAK は不一致になる"
G4 = "移植: 訓練した個体の移さない状態（最後の痕跡・回数・最後の勾配）を乱しても評価の予測はビット一致。負の対照: w の一つの符号を変えると予測が変わる"
G5 = "種子の集合 train・eval・ood は互いに素で、1〜885 と重ならない"
G6 = "別プロセスの再実行で results.tsv の SHA-256 が一致"
G7 = "このファイルの SHA-256 が freeze-memory-transfer-c0.txt と一致（実行の初めに確かめる）"

[falsification]
F1 = "P1〜P3 のどれかで、優越しない・逆向きに優越・検出不能 → その予測は外れ"
F2 = "LP が LP0 に優越しない → 結合が痕跡から損失を下げる読みは支持されない（P4 外れ）"
F3 = "INIT が一つでも RATE に勝つ → 採点か実装の誤り"
F4 = "関門のどれかが不合格 → 結果は使わない（不合格として報告）"
F5 = "V1 を下回る → 比較が成り立っても「土台が薄い」と書く"

[scope]
# 言えること: この合成世界の族と UNI の行為の分布の上で、選ばれた行為の応えを、移した結合 w と個体の痕跡で
# どれだけ予測できるか（RATE・B1 と同じ例で比べて）。
# 言えないこと: 閉ループでの効果、TRM・正式な C0 の結果、生の世界への移行、比較機能や記憶一般の獲得、
# 痕跡の維持費（この予備実験では払わない）、phenomenal_claim。不合格は「UNI の分布の上で優位を示せない」まで。
